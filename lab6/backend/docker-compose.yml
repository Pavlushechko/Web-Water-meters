version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: Water-meters-REDIScontainer
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data  # Добавьте этот volume
    networks:
      - app_network
  db:
    container_name: Water-meters
    image: postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    networks:
      - app_network

  minio:
    container_name: Water-meters-MINIOcontainer
    image: minio/minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000" # Для API
      - "9001:9001"  
    volumes:
      - minio_data:/data  # Данные MinIO будут храниться в volume
    command: server /data --console-address ":9001"
    networks:
      - app_network

volumes:
  redis_data:  
  minio_data:

networks:
  app_network:
    driver: bridge